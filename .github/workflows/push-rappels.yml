name: Rappels des offres (notifications push)

# Toutes les heures : envoie « Ton offre se termine bientôt » aux personnes dont l'offre
# personnelle se termine dans moins de 24 h (une seule fois par personne et par offre).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  rappels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier le secret SUPABASE_DB_URL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: test -n "$SUPABASE_DB_URL" || (echo "::error::Secret SUPABASE_DB_URL manquant" && exit 1)
      - name: Installer psql
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Envoyer les rappels
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          n=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tA -c "select public.push_offer_reminders()")
          echo "Rappels envoyés : $n"
